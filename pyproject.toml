[project]
name = "netacho"
version = "0.1.0"
description = "一席の音声から、演者の根多帳を作る。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3.0",
    "faster-whisper>=1.2.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
netacho = "netacho.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netacho"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
