[project]
name = "netacho"
version = "0.1.0"
description = "一席の音声から、演者の根多帳を作る。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3.0",
    "faster-whisper>=1.2.1",
    "jsonschema>=4.26.0",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
netacho = "netacho.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netacho"]

# Linux（CI）は CPU 版の torch にする（GPU 版は数 GB ある）
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
