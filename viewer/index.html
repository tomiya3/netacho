<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>根多帳</title>
<style>
:root {
  color-scheme: light;
  --paper: #efe8d8; --page: #fbf8f0; --rule: #e0d6c1; --rule-2: #cdbf9f;
  --ink: #1f1b18; --ink-2: #544a47; --ink-3: #7a7068;
  --ai: #3f4b8f; --me: #b7282e; --me-bg: #f8ece6; --copy: #595857;
  --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.75 var(--gothic); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }

/* 題と高座 */
header { display: flex; align-items: center; gap: 28px; padding: 22px 36px 14px; }
.daisen { background: var(--page); border: 1px solid var(--rule-2); outline: 3px double var(--rule-2); outline-offset: 3px; padding: 6px 24px 8px; text-align: center; min-width: 210px; }
.daisen small { display: block; font: 600 13px/1.4 var(--mincho); color: var(--ink-3); letter-spacing: .5em; }
.daisen b { display: block; font: 700 32px/1.25 var(--mincho); letter-spacing: .12em; }
.koza { color: var(--ink-2); font-size: 16px; }
.writer { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ink-2); }
.writer button { border: 1px solid var(--rule-2); background: var(--page); border-radius: 6px; padding: 4px 12px; min-height: 44px; }
.writer button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--page); }

/* 見出しのタブ */
nav { display: flex; gap: 26px; padding: 0 36px; border-bottom: 1px solid var(--rule-2); }
nav button { border: 0; border-bottom: 3px solid transparent; background: none; padding: 8px 2px; min-height: 52px; font: 700 19px var(--mincho); color: var(--ink-2); }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--me); }
nav .last { margin-left: auto; font: 400 15px var(--gothic); }
nav .count { color: var(--me); margin-left: 6px; }
main { background: var(--page); min-height: 80vh; padding: 28px 36px 120px; }
section[hidden] { display: none; }
.wrap { max-width: 1120px; margin: 0 auto; }
h2 { font: 700 26px/1.4 var(--mincho); margin: 0 0 4px; }
h3 { font: 700 21px/1.5 var(--mincho); margin: 30px 0 8px; }
.lead { color: var(--ink-2); margin: 0 0 20px; }
.small { font-size: 15px; color: var(--ink-3); }
.notice { color: var(--ink-2); font-size: 16px; margin: 8px 0; }
.status { color: var(--me); font-weight: 600; margin: 0; min-height: 1em; }

/* 3 区分：色、線、印の 3 つで見分ける */
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1; white-space: nowrap; }
.who::before { display: grid; place-items: center; width: 20px; height: 20px; font: 700 12px/1 var(--mincho); }
.who.ai { color: var(--ai); } .who.ai::before { content: "案"; border: 1.5px dashed var(--ai); border-radius: 2px; }
.who.me { color: var(--me); } .who.me::before { content: "決"; color: #fff; background: var(--me); border-radius: 50%; }
.who.copy { color: var(--copy); } .who.copy::before { content: "写"; color: #fff; background: var(--copy); border-radius: 2px; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 0 0 18px; }

.card { padding: 2px 0 2px 20px; margin: 26px 0; border-left: 3px solid var(--rule-2); }
.card.ai { border-left: 3px dashed var(--ai); }
.card.me { border-left: 3px solid var(--me); }
.card.copy { border-left: 3px solid var(--copy); }
.card.dropped { opacity: .6; }
.card-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--ink-3); }
.card-head .who { margin-left: auto; }
.ask { font: 600 22px/1.7 var(--mincho); margin: 4px 0 12px; }
.card p { margin-top: 4px; }

/* 聞く */
.plays { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 12px; }
.play { min-height: 52px; padding: 6px 20px; border-radius: 6px; border: 1.5px solid var(--ink); background: none; font-weight: 600; }
.play::before { content: "▶"; margin-right: 10px; }
.play.on { background: var(--ink); color: var(--page); }
.lines { font: 18px/1.9 var(--mincho); margin: 4px 0 12px; }
.lines .row { display: flex; gap: 14px; }
.lines .sp { flex: 0 0 7em; color: var(--ink-3); font-size: 14px; text-align: right; padding-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines .hit { background: linear-gradient(transparent 62%, #efdfae 62%); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 6px 0 12px; }
.two .label { font-size: 15px; color: var(--ink-3); }
.two .q { font: 19px/1.7 var(--mincho); margin: 2px 0 6px; }

/* 答える */
.answer { display: grid; gap: 10px; margin-top: 10px; max-width: 860px; }
.answer textarea, .answer input[type=text] { font: 20px/1.7 var(--mincho); padding: 12px 16px; width: 100%; border: 1.5px solid var(--rule-2); border-radius: 6px; background: #fff; color: var(--ink); }
.answer textarea { min-height: 112px; resize: vertical; }
.answer p { margin: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { min-height: 52px; padding: 8px 28px; border-radius: 6px; border: 1.5px solid var(--me); background: var(--me); color: #fff; font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.quiet { border: 0; background: none; color: var(--ink-3); text-decoration: underline; font-size: 16px; min-height: 44px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule-2); background: none; border-radius: 6px; padding: 6px 14px; min-height: 44px; font-size: 16px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--page); }
.dropbox { display: grid; gap: 10px; padding: 12px 0; }
.dropbox[hidden] { display: none; }
.form { gap: 18px; }
.form label { font-weight: 600; display: grid; gap: 6px; }

/* 演者の決定 */
.decided { display: flex; gap: 16px; align-items: flex-start; background: var(--me-bg); border-radius: 6px; padding: 14px 18px; margin-top: 10px; }
.seal { flex: 0 0 auto; width: 52px; height: 52px; background: var(--me); color: #fff; border-radius: 50%; display: grid; place-items: center; font: 700 24px/1 var(--mincho); transform: rotate(-6deg); }
.decided .words { font: 600 21px/1.7 var(--mincho); margin: 0; }
.group { font: 700 22px/1.5 var(--mincho); margin: 40px 0 0; padding-bottom: 4px; border-bottom: 1px solid var(--ink); }
.progress { font: 700 20px var(--mincho); margin: 0 0 8px; }

/* 波 */
.chart { position: relative; margin: 8px 0; }
.chart svg { display: block; width: 100%; height: auto; touch-action: none; }
.chart.can svg { cursor: pointer; }
.axis { fill: var(--ink-3); font: 13px var(--gothic); }
.band-t { fill: var(--ink); font: 700 14px var(--mincho); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 4px; padding: 6px 10px; font-size: 14px; white-space: nowrap; display: none; }
.keys { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; color: var(--ink-2); align-items: center; }
.keys svg { vertical-align: middle; margin-right: 6px; }
.peak { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.peak .play { min-height: 44px; padding: 2px 12px; }
.peak .line { font: 19px/1.6 var(--mincho); }
.peak .where { display: block; font: 14px var(--gothic); color: var(--ink-3); }

/* 帳面 */
.book { display: grid; grid-template-columns: 1fr auto; align-items: start; }
.index { display: flex; flex-direction: column; gap: 6px; }
.index button { writing-mode: vertical-rl; font: 700 17px/1.2 var(--mincho); letter-spacing: .1em; border: 1px solid var(--rule-2); border-left: 0; border-radius: 0 6px 6px 0; background: var(--paper); padding: 14px 10px; min-height: 110px; max-height: 300px; width: 56px; color: var(--ink-2); text-align: start; }
.index button[aria-selected="true"] { background: #fff; color: var(--ink); }
.spread { background: #fff; border: 1px solid var(--rule-2); padding: 22px 26px; min-height: 480px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }
.spread h3 { margin-top: 0; }
.entry { padding: 4px 0 4px 14px; border-left: 3px dashed var(--ai); margin: 0 0 16px; }
.entry.me { border-left: 3px solid var(--me); }
.entry.held { opacity: .55; }
.entry .kind { font: 700 14px var(--mincho); color: var(--ink-2); margin-right: 8px; }
.entry p { margin: 0; font: 18px/1.8 var(--mincho); }
.entry .sub { font: 15px/1.6 var(--gothic); color: var(--ink-3); margin-top: 2px; }
.entry summary { cursor: pointer; font-size: 15px; color: var(--ink-3); }

/* 札 */
.tanzaku-row { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 22px; flex-wrap: wrap; margin: 10px 0 30px; }
.tz { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tanzaku { writing-mode: vertical-rl; min-width: 150px; height: 500px; background: #fff; border: 1px solid var(--rule-2); padding: 30px 16px 70px; position: relative; display: flex; gap: 12px; }
.tanzaku .where { font: 600 14px/1.5 var(--mincho); color: var(--ink-3); max-block-size: 9em; }
.tanzaku .text { font: 700 23px/1.6 var(--mincho); letter-spacing: .04em; }
.tanzaku .seal { position: absolute; bottom: 14px; left: 50%; margin-left: -22px; width: 44px; height: 44px; font-size: 20px; writing-mode: horizontal-tb; }
.tz .why { max-width: 170px; font-size: 15px; color: var(--ink-2); text-align: center; line-height: 1.5; }

/* 清書 */
.vbook { writing-mode: vertical-rl; width: 100%; height: 620px; overflow-x: auto; background: #fff; border: 1px solid var(--rule-2); padding: 28px 30px; font: 20px/2.05 var(--mincho); letter-spacing: .04em; }
.vbook p { margin: 0 0 0 4px; }
.vbook .sp { font: 600 14px var(--gothic); color: var(--ink-3); margin-bottom: .6em; display: inline-block; }
.vbook .mk { font: 14px var(--gothic); color: var(--ink-3); }
.vbook h4 { font: 700 22px var(--mincho); margin: 0 0 0 28px; padding: 0 0 0 10px; border-right: 3px solid var(--ink); }
.tcy { text-combine-upright: all; }

/* 数字 */
table { border-collapse: collapse; font-size: 15px; }
th, td { border-bottom: 1px solid var(--rule); padding: 6px 18px 6px 0; text-align: left; }
.big { font: 700 21px/1.6 var(--mincho); margin: 6px 0; }
details.more { margin: 18px 0; }
details.more > summary { cursor: pointer; color: var(--ink-2); min-height: 44px; display: flex; align-items: center; }

/* 再生の帯は 1 本 */
.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: #fff; display: none; align-items: center; gap: 16px; padding: 12px 36px; z-index: 5; font-size: 17px; }
.player.show { display: flex; }
.player .bar { flex: 1; height: 6px; background: rgba(255,255,255,.25); }
.player .bar i { display: block; height: 100%; width: 0; background: #fff; }
.player button { background: #fff; color: var(--ink); border: 0; border-radius: 6px; min-height: 44px; padding: 4px 18px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="daisen"><small>根多帳</small><b id="title">根多帳</b></div>
  <div class="koza" id="sub"></div>
  <div class="writer" id="writer"></div>
</header>
<nav role="tablist" id="tabs"></nav>
<main>
  <div class="wrap">
    <section id="deshi" hidden></section>
    <section id="wave" hidden></section>
    <section id="compare" hidden></section>
    <section id="kata" hidden></section>
    <section id="cards" hidden></section>
    <section id="seisho" hidden></section>
    <section id="numbers" hidden></section>
    <div id="error"></div>
  </div>
</main>
<div class="player" id="player" role="status"></div>
<script>
"use strict";
const TABS = [["deshi", "弟子の問い"], ["wave", "高座の波"], ["compare", "比べる"], ["kata", "帳面"], ["cards", "札"], ["seisho", "清書"], ["numbers", "数字"]];
const SPOT = { kept: "2 本とも同じ言葉", moved: "来る所がずれた", ma: "一言の前の間が違う", one_side: "片方の録音でだけ拾えた", words: "笑いの所で言葉が違う", added: "2 本目に無い言葉で笑いの山", changed: "言葉が違う", makura: "枕の笑い" };
const SVG = "http://www.w3.org/2000/svg";
const POSITION = { before: "場面の前", after: "場面の後" };  // 場面の中が既定なので書かない
const WHY = { no_candidate: "回収の後に反応候補が見つからない", low_rank: "回収の後の反応候補が小さい方" };
const ISSUE = { missing_step: "型が無くて演れない", unclear_scene: "どの場面か追えない", no_makura: "枕で何を説明するか不明",
  no_sage: "サゲの運びが無い", ask_performer: "本人に聞くしかない" };
const REACT = { laugh: "笑い", applause: "拍手", reaction: "手で付けた" };
const LABEL = { ai: "Claude の候補", me: "演者の決定", copy: "スクリプトの転記" };
const REASONS = ["笑いの取り違え（声や物音）", "問いが的外れ", "答えるほどの事ではない"];
const WRITERS = ["本人", "作者（代筆）"];
const ROLE = { writer: "構成作家役", checker: "照合役", deshi: "弟子役", noter: "ノート役", scribe: "速記役", aligner: "対応づけ役", asker: "聞き役" };
const KANJI = ["〇", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
const TOKEN = new URLSearchParams(location.search).get("t");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k);
  return e;
}
function svg(tag, attrs = {}, text) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const byId = list => Object.fromEntries(list.map(x => [x.id, x]));
const kanji = n => n <= 10 ? KANJI[n] : String(n);
const who = (k, text) => el("span", { class: "who " + k }, text || LABEL[k]);
const writer = () => localStorage.getItem("netacho-speaker") || "";  // 代筆が「本人」で残らないよう、既定を置かない
const kozaName = id => id.replace(/^0000-00-00-?/, "") || id;
let KOZA = null;  // 型と噺は演目全体の物。別の高座の項目の時刻で、この高座の録音を鳴らさない
const here = i => i?.source?.koza_id === KOZA;
const dateOf = date => date === "0000-00-00" ? "日付なし" : date;

/* どの画面の「聞く」も、下の帯 1 本で鳴らす */
const audio = new Audio();
let playing = null;
function stop() {
  audio.pause();
  document.getElementById("player").classList.remove("show");
  playing?.classList.remove("on");
  playing = null;
}
function play(button, label, from, to, side = "a") {
  const wasOn = button && playing === button;
  stop();
  if (wasOn) return;
  const bar = document.getElementById("player");
  playing = button;
  button?.classList.add("on");
  from = Math.max(0, from);
  audio.src = `/clip?from=${from.toFixed(1)}&to=${to.toFixed(1)}&side=${side}&t=${encodeURIComponent(TOKEN || "")}`;
  const fill = el("i");
  const text = el("span", {}, `${label}　${clock(from)} から`);
  bar.replaceChildren(text, el("div", { class: "bar" }, fill), el("button", { type: "button", onclick: stop }, "止める"));
  bar.classList.add("show");
  audio.ontimeupdate = () => {
    fill.style.width = `${Math.min(100, audio.currentTime / (to - from) * 100)}%`;
    window.dispatchEvent(new CustomEvent("playhead", { detail: { t: from + audio.currentTime, side } }));
  };
  audio.onended = stop;
  audio.onerror = () => { playing?.classList.remove("on"); playing = null; text.textContent = "録音が見つかりません。"; };
  audio.play().catch(() => {});
}
function playButton(label, from, to, side = "a", title = label) {
  if (!TOKEN) return null;  // 切り抜きはトークンのある画面にだけ渡す
  const b = el("button", { type: "button", class: "play" }, label);
  b.addEventListener("click", () => play(b, title, from, to, side));
  return b;
}

async function send(path, body, note, tab = "#deshi") {
  note.textContent = "";
  if (!body.speaker) { note.textContent = "右上の「書く人」を先に選んでください。"; return false; }
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Netacho-Token": TOKEN }, body: JSON.stringify(body) });
    const doc = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(doc.error || String(res.status));
    if (doc.warning) { note.textContent = doc.warning; return true; }
    history.replaceState(null, "", location.search + tab);
    location.reload();
    return true;
  } catch (e) { note.textContent = `保存できませんでした：${e.message}`; return false; }
}

/* ---------- 場面の時刻 ---------- */
const timed = d => d.scenes.filter(s => s.t0 !== undefined);
const sceneAt = (scenes, t) => scenes.find(s => t >= s.t0 && t < s.t1);

/* ---------- 比べた所 ---------- */
function compareNames(c) {
  return c.practice ? ["本番", "稽古"] : [kozaName(c.koza_a), kozaName(c.koza_b)];
}
function spotBody(s, c) {
  const [nameA, nameB] = compareNames(c);
  const side = (name, row, laugh, key) => el("div", {}, el("div", { class: "label" }, `${name}（${clock(row.t)}）`),
    el("p", { class: "q" }, `「${row.quote}」`), playButton(`${name}を聞く`, row.t - 8, Math.max(row.end, laugh ?? 0) + 6, key));
  const left = side(nameA, s.a, s.laugh_a, "a");
  const right = s.b ? side(nameB, s.b, s.laugh_b, "b")
    : s.kind === "makura" ? null : el("div", {}, el("div", { class: "label" }, nameB), el("p", { class: "small" }, "この言葉はありません。"));
  return el("div", { class: "two" }, left, right);
}

/* ---------- 弟子の問い ---------- */
function entries(d) {
  const items = byId([...d.hanashi, ...d.kata]);
  const issues = byId(d.review?.issues || []);
  const spots = byId(d.compare?.spots || []);
  const order = Object.fromEntries(d.scenes.map(s => [s.id, s.order]));
  return (d.questions?.questions || []).map(q => {
    const spot = q.spot_id ? spots[q.spot_id] : null;
    const place = d.places?.[q.id] || null;
    const anchor = issues[q.issue_id]?.anchor?.item_id;
    const item = anchor ? items[anchor] : null;
    const t = spot ? spot.a.t : place ? place.t0 : here(item) ? item.source.t0 : null;
    return { q, spot, place, item, t, order: order[q.scene_id] ?? 99 };
  }).sort((a, b) => a.order - b.order || (a.t ?? 0) - (b.t ?? 0));
}

function answerForm(q) {
  const words = el("textarea", { "aria-label": "答え", placeholder: "話すように書いてください" });
  const note = el("p", { class: "status", role: "status" });
  const ok = el("button", { type: "button", class: "btn" }, "答える");
  ok.addEventListener("click", async () => {
    ok.disabled = true;
    if (!await send("/api/answer", { question: q.id, speaker: writer(), words: words.value }, note)) ok.disabled = false;
  });
  const reason = el("input", { type: "text", "aria-label": "捨てる理由", placeholder: "理由（選ぶか、書く）" });
  const chips = REASONS.map(r => el("button", { type: "button", class: "chip", "aria-pressed": "false", onclick: e => {
    chips.forEach(c => c.setAttribute("aria-pressed", String(c === e.currentTarget))); reason.value = r; } }, r));
  const drop = el("button", { type: "button", class: "btn" }, "この問いを捨てる");
  drop.addEventListener("click", () => send("/api/dismiss", { question: q.id, speaker: writer(), reason: reason.value }, note));
  const box = el("div", { class: "dropbox", hidden: "" }, el("div", {}, "捨てた問いは元に戻せません。"), el("div", { class: "chips" }, chips), reason, el("div", {}, drop));
  const open = el("button", { type: "button", class: "quiet", onclick: () => { box.hidden = !box.hidden; } }, "的外れなので捨てる");
  return el("div", { class: "answer" }, words, el("p", { class: "small" }, "書いたまま型に残ります。あとから直せません。"), el("div", { class: "row" }, ok, open), box, note);
}

function askCard(e, d) {
  const { q, spot, place, item } = e;
  const text = q.text.replace(/^\d+:\d+(?:\.\d+)? の(?:笑いの所|比較)(?:（[^）]*）)?(?:「[^」]*」)?：/, "");
  const fixed = place && d.gaps?.surprises?.some(s => s.t0 === place.t0 && s.question_source !== "claude");
  const body = [el("p", { class: "ask" }, text)];
  if (spot) body.push(spotBody(spot, d.compare));
  else if (place) {

/* ---------- 高座の波 ---------- */
function drawWave(root, reactions, opts = {}) {
  const { scenes = [], marks = [], side = "a", height = 300 } = opts;
  const s = reactions?.scores;
  if (!s || !s.laugh.length) { root.append(el("p", { class: "notice" }, "スコアがありません。")); return null; }
  const W = 1120, H = height, L = 10, R = 10, BAND = scenes.length ? 30 : 0, MARK = marks.length ? 58 : 14, T = BAND + MARK + 6, B = 26;
  const end = s.seconds || (s.laugh.length - 1) * s.stride + s.window;
  const x = t => L + (W - L - R) * t / end;
  const top = Math.max(...s.laugh, 0.08);  // 検出の下限より小さい山を、天井まで伸ばさない
  const y = v => T + (H - T - B) * (1 - Math.min(v / top, 1));
  const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": TOKEN ? "高座の笑いの波。押した所から聞けます" : "高座の笑いの波" });
  scenes.forEach((sc, i) => {
    g.append(svg("rect", { x: x(sc.t0), y: 0, width: Math.max(x(sc.t1) - x(sc.t0) - 2, 1), height: BAND, fill: i % 2 ? "#e6dcc6" : "#f0e9da" }));
    const w = x(sc.t1) - x(sc.t0), full = `${kanji(sc.order)} ${sc.title}`, short = `${kanji(sc.order)} ${sc.title.split("・")[0]}`;
    g.append(svg("text", { class: "band-t", x: x(sc.t0) + 8, y: 20 }, w > full.length * 15 + 10 ? full : w > short.length * 15 + 10 ? short : w > 24 ? kanji(sc.order) : ""));
  });
  // 細かいとげを潰さないよう、横 3px ごとに最大を取る
  const bins = Math.floor((W - L - R) / 3), per = end / bins, pts = [];
  for (let b = 0; b <= bins; b++) {
    const i0 = Math.max(0, Math.floor((b * per - s.window / 2) / s.stride));
    const i1 = Math.min(s.laugh.length - 1, Math.ceil(((b + 1) * per - s.window / 2) / s.stride));
    let m = 0;
    for (let i = i0; i <= i1; i++) m = Math.max(m, s.laugh[i] || 0);
    pts.push(`${x(b * per).toFixed(1)},${y(m).toFixed(1)}`);
  }
  g.append(svg("polygon", { points: `${x(0)},${y(0)} ${pts.join(" ")} ${x(end)},${y(0)}`, fill: "var(--ink)", opacity: .12 }));
  g.append(svg("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-linejoin": "round" }));
  g.append(svg("line", { x1: L, x2: W - R, y1: y(0), y2: y(0), stroke: "var(--rule-2)" }));
  // 大きな笑いと中くらいの笑い。同じ高座の中の順位で、高座どうしでは比べない
  const laughs = reactions.reactions.filter(r => r.kind === "laugh" && r.method !== "manual").sort((a, b) => (a.strength_rank ?? Infinity) - (b.strength_rank ?? Infinity));
  const nBig = Math.max(3, Math.round(laughs.length * 0.15));
  const peakOf = r => {
    let m = 0;
    for (let i = Math.floor(r.t0 / s.stride); i <= Math.ceil(r.t1 / s.stride); i++) m = Math.max(m, s.laugh[i] || 0);
    return m;
  };
  laughs.forEach((r, i) => {
    const big = i < nBig, k = big ? 8 : 4, cx = x((r.t0 + r.t1) / 2), cy = y(peakOf(r)) - 5;
    g.append(svg("path", { d: `M${cx - k} ${cy} L${cx + k} ${cy} L${cx} ${cy - k * 1.5} Z`, fill: big ? "var(--ink)" : "var(--page)", stroke: "var(--ink)", "stroke-width": big ? 0 : 1.2 }));
  });
  for (const r of reactions.reactions.filter(r => r.method === "manual"))
    g.append(svg("rect", { x: x(r.t0), width: Math.max(x(r.t1) - x(r.t0), 3), y: T, height: H - T - B, fill: "var(--ink-3)", opacity: .25 }));
  let lastX = -99, lower = false;  // 近い印は 2 段に分けて、押せるようにする
  for (const m of [...marks].sort((a, b) => a.t - b.t)) {
    const cx = x(m.t), color = m.done ? "var(--me)" : "var(--ai)";
    lower = cx - lastX < 26 && !lower;
    lastX = cx;
    const cy = BAND + (lower ? 41 : 16);
    g.append(svg("line", { x1: cx, x2: cx, y1: cy + 12, y2: H - B, stroke: color, "stroke-dasharray": m.note ? "3 4" : "0", opacity: .45 }));
    if (m.note) { g.append(svg("rect", { x: cx - 8, y: cy - 8, width: 16, height: 16, fill: "var(--page)", stroke: "var(--ai)", "stroke-width": 1.5, "stroke-dasharray": "3 2" })); continue; }
    const c = svg("g", { style: "cursor:pointer" });
    c.append(svg("circle", { cx, cy, r: 12, fill: color }), svg("text", { x: cx, y: cy + 5, "text-anchor": "middle", fill: "#fff", style: "font: 700 13px var(--mincho)" }, m.done ? "答" : "問"));
    c.addEventListener("click", ev => { ev.stopPropagation(); select("deshi"); document.getElementById("q-" + m.id)?.scrollIntoView({ block: "start" }); });
    g.append(c);
  }
  const step = end > 1200 ? 300 : end > 300 ? 60 : 10;
  for (let t = 0; t <= end; t += step) g.append(svg("text", { class: "axis", x: x(t), y: H - 8, "text-anchor": t ? "middle" : "start" }, clock(t)));
  const cross = svg("line", { y1: BAND, y2: H - B, stroke: "var(--ink-2)", visibility: "hidden" });
  const head = svg("line", { y1: BAND, y2: H - B, stroke: "var(--me)", "stroke-width": 2, visibility: "hidden" });
  g.append(cross, head);
  const box = el("div", { class: "chart" + (TOKEN ? " can" : "") }), tip = el("div", { class: "tip" });
  box.append(g, tip);
  const timeAt = ev => {
    const r = g.getBoundingClientRect();
    return Math.max(0, Math.min(end, ((ev.clientX - r.left) * W / r.width - L) / (W - L - R) * end));
  };
  g.addEventListener("pointermove", ev => {
    const t = timeAt(ev), r = g.getBoundingClientRect();
    cross.setAttribute("x1", x(t)); cross.setAttribute("x2", x(t)); cross.setAttribute("visibility", "visible");
    tip.textContent = `${clock(t)}　${sceneAt(scenes, t)?.title || ""}${TOKEN ? "　押すとここから聞けます" : ""}`;
    tip.style.display = "block"; tip.style.left = Math.max(0, Math.min(ev.clientX - r.left + 14, r.width - 340)) + "px"; tip.style.top = "36px";
  });
  g.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  g.addEventListener("click", ev => { if (TOKEN) { const t = timeAt(ev); play(null, sceneAt(scenes, t)?.title || "高座", t - 3, t + 20, side); } });
  window.addEventListener("playhead", ev => {
    if (ev.detail.side !== side) return;
    head.setAttribute("x1", x(ev.detail.t)); head.setAttribute("x2", x(ev.detail.t)); head.setAttribute("visibility", "visible");
  });
  root.append(box);
  return { laughs, nBig };
}

function renderWave(d) {

  }
  root.append(el("p", { class: "small" }, "笑いは録音から機械で拾ったものです。山の無い所も、反応が無かったという意味ではありません。"));

    el("table", {}, el("tr", {}, ["話題", "噺の下地", nameA, nameB].map(t => el("th", {}, t))),

function renderCompare(d) {

  root.append(el("p", { class: "lead" }, "どの台詞が同じくだりかは Claude が読み、笑いと間は録音から測っています。笑いの大きさは比べていません。笑いを拾えていない所も、反応が無かったという意味ではありません。"));
  root.append(el("p", {}, `${nameA} と ${nameB}。対応の付いた割合 ${Math.round(c.share * 100)}%`));

  if (kept.length) root.append(el("details", { class: "more" }, el("summary", {}, `同じ言葉の所（${kept.length} か所）`), kept.map(row)));

  ok.addEventListener("click", async () => {
    ok.disabled = true;  // 2 度押しで「同じ札がある」と出さない。保存できたら押し直さない
    const saved = await send("/api/decide", { scene, position: "within", speaker: writer(), words: words.value || text.value, card: text.value, why: why.value }, note, "#cards");
    if (!saved) ok.disabled = false;
  });
  return el("div", { class: "answer form" }, el("div", { class: "chips" }, chips),
    el("label", {}, "札の文", text), el("label", {}, "理由", why), el("label", {}, "型に残す言葉", words), el("div", {}, ok), note);
}
function renderCards(d) {
  const root = document.getElementById("cards");
  root.append(el("h2", {}, "札"), el("p", { class: "lead" }, "次の高座の前に見る札です。演者が決めた事だけを、場面の順に並べます。"),
    el("p", {}, who("copy"), "　演者の決定をスクリプトが写しただけです。LLM の呼び出しは 0 回です。"));
  const cards = d.guide?.cards || [];
  if (!cards.length) root.append(el("p", {}, "札はまだありません。"));
  else root.append(el("div", { class: "tanzaku-row" }, cards.map(c => el("div", { class: "tz" },
    el("div", { class: "tanzaku" }, el("span", { class: "where" }, c.copied_fields.scene_title, POSITION[c.copied_fields.position] ? `（${POSITION[c.copied_fields.position]}）` : ""), el("span", { class: "text" }, c.text), el("span", { class: "seal", title: LABEL.me }, "決")),
    el("div", { class: "why" }, c.copied_fields.reason)))));
  if (TOKEN) root.append(el("h2", {}, "札に出す"), decideForm(d));
}

/* ---------- 清書 ---------- */
function upright(text) {  // 縦書きで 1〜2 桁の数字を立てる
  return text.split(/(?<!\d)(\d{1,2})(?!\d)/).map((part, i) => i % 2 ? el("span", { class: "tcy" }, part) : part);
}
function renderSeisho(d) {
  const root = document.getElementById("seisho");
  root.append(el("h2", {}, "清書"));
  if (!d.seisho) { root.append(el("p", {}, "清書はまだありません。netacho seisho で作ります。")); return; }
  root.append(el("p", { class: "lead" }, "Claude が読み物に整えました。話者と直した語は推定です。右から読みます。"));
  const seg = id => +id.split("-")[1];
  const heads = Object.fromEntries(d.scenes.map(s => [seg(s.segs[0]), s]));
  const book = el("div", { class: "vbook", tabindex: "0" });
  let last = null;
  for (const l of d.seisho.lines) {
    const head = heads[seg(l.seg_id)];
    if (head) { book.append(el("h4", {}, `${kanji(head.order)}　${head.title}`)); last = null; }
    const changed = l.speaker && l.speaker !== last;
    last = l.speaker || last;
    book.append(el("p", {}, changed ? el("span", { class: "sp" }, l.speaker) : null, upright(l.text), (l.marks || []).map(m => el("span", { class: "mk" }, m))));
  }
  root.append(book);
}

/* ---------- 数字 ---------- */
function renderNumbers(d) {
  const root = document.getElementById("numbers");
  root.append(el("h2", {}, "数字"), el("p", { class: "lead" }, "作者と審査の方へ。値はこの高座の実測です。"));
  const g = d.gaps, r = d.run;
  if (g) {
    root.append(el("h3", {}, "笑いどころの予測と実際"));
    if (!g.judged) root.append(el("p", {}, "自動で拾った笑いが無いので、比べていません。"));
    else {
      root.append(el("p", { class: "big" }, `笑い ${g.laughs_total} か所のうち ${g.laughs_hit} か所が予測の窓に入った`));
      if (g.humps_total === 0) root.append(el("p", {}, "笑いの山は 0 個でした。"));
      else if (g.humps_total != null) root.append(el("p", { class: "big" }, `笑いの山 ${g.humps_total} 個のうち ${g.humps_hit} 個（${Math.round(g.humps_hit / g.humps_total * 100)}%）${g.humps_expected != null ? `。同じ長さの窓を音声全体に置くと、見込みは ${Math.round(g.humps_expected * 100)}%` : ""}`));
      root.append(el("p", {}, `項目ごとの内訳：的中 ${g.hits.length}${g.weak ? `  弱い山 ${g.weak.length}` : ""}  空振り ${g.misses.length}  予測なしで反応あり ${g.surprise_total}。1 つの笑いに項目が重なることがあります。`));
      if (!g.weak) root.append(el("p", {}, "前の版の数え方です。空振りに弱い山を含みます。note をやり直すと分かれます。"));
      if (g.humps_total == null && g.peak_rate != null && g.baseline_rate != null) root.append(el("p", {}, `予測の窓 ${g.peak_n} 件のうち笑いの山がある割合 ${Math.round(g.peak_rate * 100)}%（同じ長さの窓を音声全体に置くと ${Math.round(g.baseline_rate * 100)}%）`));
      root.append(el("p", { class: "small" }, `Claude は反応を見ずに、文字起こしだけで笑いどころを予測しました。窓は音声の ${Math.round(g.window_share * 100)}% を覆っています。空振りは、検出できなかっただけのこともあります。一席だけの観察です。`));
    }
  }
  if (r?.checker) root.append(el("p", {}, `照合：言える ${r.checker.supported}、一部だけ ${r.checker.weak}、言えない ${r.checker.unsupported}`));
  if (r?.deshi) root.append(el("p", {}, `弟子役の指摘：1 周目 ${r.deshi.round1}${r.deshi.round2 === null ? "" : ` → 2 周目 ${r.deshi.round2}`}`));
  if (r?.total_cost_usd != null) root.append(el("p", {}, `この高座の Claude の費用：$${r.total_cost_usd.toFixed(2)}`));
  if (r?.roles) root.append(el("h3", {}, "Claude の役"), el("table", {}, el("tr", {}, ["役", "モデル", "呼んだ回数", "費用", "時間"].map(h => el("th", {}, h))),
    r.roles.map(x => el("tr", {}, el("td", {}, ROLE[x.name] || x.name), el("td", {}, x.model), el("td", {}, x.calls), el("td", {}, `$${x.cost_usd.toFixed(2)}`), el("td", {}, `${Math.round(x.seconds)} 秒`)))));
  const rows = d.reactions.reactions;
  root.append(el("details", { class: "more" }, el("summary", {}, `反応の候補の一覧（${rows.length} 件）`),
    el("table", {}, el("tr", {}, ["順位", "時刻", "種類"].map(h => el("th", {}, h))),
      rows.map(x => el("tr", {}, el("td", {}, x.strength_rank ?? "-"), el("td", {}, `${clock(x.t0)} - ${clock(x.t1)}`), el("td", {}, REACT[x.kind] || x.kind))))));
}

/* ---------- 枠 ---------- */
function select(id) {
  for (const [key] of TABS) {
    document.getElementById(key).hidden = key !== id;
    document.getElementById("tab-" + key).setAttribute("aria-selected", String(key === id));
  }
  window.scrollTo(0, 0);
}
function renderWriter() {
  const box = document.getElementById("writer");
  if (!TOKEN) { box.replaceChildren(); return; }
  box.replaceChildren(el("span", {}, "書く人"), ...WRITERS.map(w => el("button", { type: "button", "aria-pressed": String(w === writer()),
    onclick: () => { localStorage.setItem("netacho-speaker", w); renderWriter(); } }, w)));
}

async function main() {
  const tabs = document.getElementById("tabs");
  for (const [key, label] of TABS) {
    tabs.append(el("button", { id: "tab-" + key, role: "tab", "aria-selected": "false", class: key === "numbers" ? "last" : "",
      onclick: () => { select(key); history.replaceState(null, "", location.search + "#" + key); } }, label));
  }
  const run = new URLSearchParams(location.search).get("run") || ".";
  try {
    const res = await fetch(`${run}/view.json`);
    if (!res.ok) throw new Error(String(res.status));
    const d = await res.json();
    KOZA = d.koza.id;
    const title = d.run?.seisho?.title || d.koza.neta;
    document.getElementById("title").textContent = title;
    document.title = `根多帳：${title}`;
    const seconds = d.reactions?.scores?.seconds;
    document.getElementById("sub").textContent = [dateOf(d.koza.date), d.koza.venue, seconds ? clock(seconds) : ""].filter(Boolean).join("　");
    renderWriter();
    const open = (d.questions?.questions || []).filter(q => !q.answer && !q.dismissed).length;
    if (open) document.getElementById("tab-deshi").append(el("span", { class: "count", "aria-label": `残り ${open} 問` }, String(open)));
    renderDeshi(d); renderWave(d); renderCompare(d); renderKata(d); renderCards(d); renderSeisho(d); renderNumbers(d);
    select(TABS.some(([k]) => "#" + k === location.hash) ? location.hash.slice(1) : open ? "deshi" : "wave");
  } catch (e) {
    document.getElementById("error").append(el("p", { class: "notice" },
      `読み込めません（${e.message}）。netacho view で書き出してから開きます。`));
  }
}
main();
</script>
